<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#013A7C">
<meta name="description" content="Imbituva — aplicativo offline-first.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Você está offline — Imbituva</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  color-scheme:light;
  --navy:#013A7C;--navy-2:#023E86;--navy-deep:#012B64;
  --ink:#000E22;--muted:#49505A;--blue:#0157BE;--gray:#8A8E93;--amber:#F0CA77;
  --bg-top:#F7F8FC;--bg-bottom:#EFF2F7;
  --shadow:0 18px 40px rgba(9,32,72,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:linear-gradient(180deg,var(--bg-top) 0%,#F2F4F9 45%,var(--bg-bottom) 100%);
  color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
}
.screen{
  flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;text-align:center;padding:40px 24px 24px;max-width:560px;width:100%;margin:0 auto;
}
.mark{
  width:132px;height:132px;border-radius:50%;padding:5px;background:var(--amber);
  box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.mark svg{width:100%;height:100%;display:block;border-radius:50%}
h1{
  margin:28px 0 0;font-size:clamp(28px,8.4vw,38px);line-height:1.12;font-weight:800;
  letter-spacing:-.02em;color:var(--ink);
}
.lead{
  margin:18px 0 0;font-size:clamp(15px,4.2vw,17px);line-height:1.55;color:var(--muted);
  max-width:420px;text-wrap:balance;
}
.actions{width:100%;max-width:460px;margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:18px}
.btn{
  appearance:none;border:0;width:100%;cursor:pointer;font:inherit;font-size:17px;font-weight:700;
  color:#fff;padding:17px 22px;border-radius:12px;background:linear-gradient(180deg,var(--navy-2),var(--navy-deep));
  box-shadow:0 12px 26px rgba(1,35,80,.26);transition:transform .15s ease,opacity .15s ease;
}
.btn:hover{opacity:.94}
.btn:active{transform:scale(.985)}
.link{
  appearance:none;background:none;border:0;padding:4px 8px;cursor:pointer;font:inherit;
  font-size:17px;font-weight:600;color:#33415C;text-decoration:none;
}
.link:hover{color:var(--navy);text-decoration:underline}
.status{
  margin:22px 0 0;display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);
}
.dot{width:9px;height:9px;border-radius:50%;background:#e11d48;flex:0 0 auto}
.dot.on{background:#16a34a}
.tabbar{
  flex:0 0 auto;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -10px 30px rgba(9,32,72,.08);
  padding:14px 8px calc(14px + env(safe-area-inset-bottom));
  display:flex;align-items:stretch;justify-content:space-around;
}
.tabbar a{
  flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:6px;
  color:var(--gray);text-decoration:none;font-size:11px;font-weight:600;letter-spacing:.01em;
}
.tabbar a svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar a[aria-current="page"]{color:var(--blue)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="screen">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <circle cx="512" cy="512" r="470" fill="#FFFFFF"/>
      <path d="M300 640 A100 100 0 0 1 300 440 A187 110 0 0 1 674 440 A100 100 0 0 1 674 640 Z"
            fill="none" stroke="#063C7C" stroke-width="34" stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="196" y1="718" x2="747" y2="303" stroke="#FFFFFF" stroke-width="74" stroke-linecap="round"/>
      <line x1="196" y1="718" x2="747" y2="303" stroke="#063C7C" stroke-width="34" stroke-linecap="round"/>
    </svg>
  </div>

  <h1>Você está offline</h1>

  <p class="lead">Verifique sua conexão com a internet. Seus dados serão sincronizados automaticamente assim que a conexão voltar.</p>

  <div class="actions">
    <button class="btn" id="retry" type="button">Tentar novamente</button>
    <button class="link" id="continue" type="button">Continuar offline</button>
  </div>

  <p class="status" role="status" aria-live="polite">
    <span class="dot" id="dot"></span><span id="statusText">Verificando conexão…</span>
  </p>
</main>

<nav class="tabbar" aria-label="Navegação principal">
  <a href="./" aria-current="page" aria-label="Início">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.6 12 3.2l9 7.4V20a1 1 0 0 1-1 1h-5.2v-6H9.2v6H4a1 1 0 0 1-1-1z"/></svg>
  </a>
  <a href="./documentos" aria-label="Arquivos">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h3.9l2 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
  </a>
  <a href="./perfil" aria-label="Perfil">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="3.8"/><path d="M20 20.5v-1.2a4.6 4.6 0 0 0-4.6-4.6H8.6A4.6 4.6 0 0 0 4 19.3v1.2"/></svg>
  </a>
  <a href="./configuracoes" aria-label="Ajustes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.6a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5v.2a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
  </a>
</nav>

<script>
(function () {
  var dot = document.getElementById('dot');
  var text = document.getElementById('statusText');
  function set(online) {
    dot.className = online ? 'dot on' : 'dot';
    text.textContent = online ? 'Conexão restabelecida.' : 'Sem conexão com a internet.';
  }
  document.getElementById('retry').addEventListener('click', function () { location.reload(); });
  document.getElementById('continue').addEventListener('click', function () { location.replace('./'); });
  window.addEventListener('offline', function () { set(false); });
  window.addEventListener('online', function () { set(true); setTimeout(function () { location.reload(); }, 500); });
  set(navigator.onLine);
})();
</script>
</body>
</html>
